<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta Verificada · Alianza Cívica Pichincha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      background: #F4F7FB;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(13, 59, 102, 0.14);
      text-align: center;
    }
    .header {
      background: #0D3B66;
      color: #FFFFFF;
      padding: 22px 20px;
      border-bottom: 4px solid #E9A825;
    }
    .header span { color: #E9A825; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .header h1 { font-size: 20px; margin-top: 4px; }
    .body { padding: 30px 24px; }
    .icon {
      width: 72px; height: 72px; border-radius: 50%;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: bold;
      background: #E6F7EE; color: #0F9D58;
    }
    .err { background: #FEE2E2; color: #DC2626; }
    h2 { color: #0F172A; font-size: 22px; margin-bottom: 10px; }
    p { color: #475569; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      background: #0F9D58;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span>Lista 10 · Pichincha – Quito</span>
      <h1>Alianza Cívica Pichincha</h1>
    </div>
    <div class="body">
      <div id="iconBox" class="icon">✓</div>
      <h2 id="title">¡Cuenta verificada!</h2>
      <p id="message">
        Tu correo electrónico ha sido confirmado correctamente. Ya puedes regresar a la aplicación móvil e iniciar sesión con tu contraseña temporal.
      </p>
      <a id="openAppBtn" class="btn" href="controlelectoral://login">Volver a la aplicación</a>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const hash = window.location.hash || '';
      const isRecovery = params.get('flow') === 'nueva-clave' || hash.includes('type=recovery');
      const btn = document.getElementById('openAppBtn');

      if (hash.includes('error=')) {
        const iconBox = document.getElementById('iconBox');
        iconBox.className = 'icon err';
        iconBox.textContent = '!';
        document.getElementById('title').textContent = 'Enlace inválido o expirado';
        document.getElementById('message').textContent =
          'Este enlace ya fue utilizado o expiró. Regresa a la aplicación para solicitar uno nuevo.';
        btn.href = 'controlelectoral://login';
        return;
      }

      if (isRecovery) {
        const recoveryLink = 'controlelectoral://nueva-clave' + hash;
        document.getElementById('title').textContent = 'Recuperación de contraseña';
        document.getElementById('message').textContent =
          'Toca el botón inferior desde tu teléfono celular para establecer tu nueva contraseña.';
        btn.textContent = 'Cambiar mi contraseña en la app';
        btn.href = recoveryLink;
        setTimeout(function () { window.location.href = recoveryLink; }, 350);
      }
    })();
  </script>
</body>
</html>
